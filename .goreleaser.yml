# .goreleaser.yml - Build configuration for hoot
# https://goreleaser.com/introduction

project_name: hoot

before:
  hooks:
    - go mod download

builds:
  - id: hoot
    binary: hoot
    main: ./hoot.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - relays.txt
      - assets/**/*
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: macOS

checksum:
  name_template: 'SHA256SUMS.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: oth-body
    name: hoot
  draft: true
  prerelease: auto

brews:
  - id: hoot
    github:
      owner: oth-body
      name: homebrew-hoot
    homepage: https://github.com/oth-body/hoot
    description: A terminal Nostr client
    license: MIT
    dependencies:
      - name: go
    install: |
      bin.install "hoot"
