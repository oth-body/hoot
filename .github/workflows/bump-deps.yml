# One-off: regenerate go.mod/go.sum with Go 1.26 (the session that made this
# PR couldn't reach proxy.golang.org). Removed again in the next commit.
name: bump-deps
on:
  push:
    branches: [chore/deps-and-vulncheck]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/deps-and-vulncheck
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Bump golang.org/x modules
        run: |
          go version
          go mod edit -go=1.26.0
          go get golang.org/x/crypto@latest golang.org/x/sys@latest golang.org/x/term@latest golang.org/x/text@latest golang.org/x/net@latest
          go mod tidy
          go build ./... && go vet ./...
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): bump golang.org/x modules; require Go 1.26

          Generated by the bump-deps workflow with $(go version | cut -d' ' -f3)." || exit 0
          git push
